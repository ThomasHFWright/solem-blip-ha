[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solem-blip-ha"
version = "1.4.1"
description = "Home Assistant integration for Solem BL-IP irrigation controllers"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "pytest-homeassistant-custom-component==0.13.375",
    # Full-setup tests walk the real bluetooth -> usb dependency chain;
    # these HA optional deps are not pulled in by the test harness itself.
    "aiousbwatcher>=1.1",
    "serialx>=1.11",
    "pyserial-asyncio-fast>=0.16",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["custom_components"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components.solem_blip --cov-fail-under=95 --cov-report=term-missing"

[tool.coverage.run]
# The vendored transport is validated by its upstream suite plus focused local
# resilience tests; integration coverage remains comparable across upgrades.
omit = ["custom_components/solem_blip/ble/*"]

[tool.uv]
environments = ["python_full_version >= '3.14.2'"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
files = ["custom_components/solem_blip"]
